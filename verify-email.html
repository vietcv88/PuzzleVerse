<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email - PuzzleVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #ffffff;
      --muted: rgba(255,255,255,.72);
      --deep: #121A5F;
      --violet: #5B6CFF;
      --violet-rgb: 91,108,255;
      --violet2: #5C6CF6;
      --violet2-rgb: 92,108,246;
      --gold: #FFD471;
      --gold2: #FFE9A6;
      --line: rgba(255,255,255,.13);
      --shadow: 0 28px 90px rgba(23,12,78,.34);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Manrope, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255,212,113,.18), transparent 26%),
        radial-gradient(circle at 90% 10%, rgba(var(--violet2-rgb),.35), transparent 30%),
        radial-gradient(circle at 55% 90%, rgba(var(--violet-rgb),.28), transparent 34%),
        linear-gradient(135deg,#101752 0%,#202B8A 42%,var(--violet) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, rgba(255,255,255,.075), transparent 22%, transparent 75%, rgba(255,255,255,.05)),
        radial-gradient(circle at 50% 50%, transparent 0, transparent 55%, rgba(0,0,0,.16) 100%);
      z-index: -1;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .message {
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 20px;
      border: 4px solid rgba(255,255,255,.18);
      border-top: 4px solid var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(180deg,var(--gold2),var(--gold));
      color: var(--deep);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      opacity: 0.95;
    }

    .hidden {
      display: none;
    }

    .sub-text {
      margin-top: 16px;
      font-size: 13px;
      color: rgba(255,255,255,.55);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">PuzzleVerse</div>
    <div class="title" id="title">Verifying your email...</div>
    <div class="spinner" id="spinner"></div>
    <div class="message" id="message">Please wait a moment.</div>
    <button id="retryButton" class="btn hidden">Try Again</button>
    <div class="sub-text" id="subText">You can close this page after verification is complete.</div>
  </div>

  <script>
    const VERIFY_API_URL = "https://ugk2ue2jfe.execute-api.ap-southeast-1.amazonaws.com/PuzzleAPIs/verification";

    const titleEl = document.getElementById("title");
    const messageEl = document.getElementById("message");
    const spinnerEl = document.getElementById("spinner");
    const retryButtonEl = document.getElementById("retryButton");
    const subTextEl = document.getElementById("subText");

    function setLoadingState() {
      titleEl.textContent = "Verifying your email...";
      messageEl.textContent = "Please wait a moment.";
      spinnerEl.classList.remove("hidden");
      retryButtonEl.classList.add("hidden");
      subTextEl.textContent = "You can close this page after verification is complete.";
    }

    function setSuccessState(message) {
      titleEl.textContent = "Email verified successfully";
      messageEl.textContent =
        message || "Your PuzzleVerse account has been activated. You can now return to the app.";
      spinnerEl.classList.add("hidden");
      retryButtonEl.classList.add("hidden");
      subTextEl.textContent = "You may now reopen PuzzleVerse.";
    }

    function setErrorState(message) {
      titleEl.textContent = "Verification failed";
      messageEl.textContent =
        message || "The verification link is invalid or has expired.";
      spinnerEl.classList.add("hidden");
      retryButtonEl.classList.remove("hidden");
      subTextEl.textContent = "Please try again or request a new verification email.";
    }

    function getTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("token");
    }

    async function verifyEmail() {
      const token = getTokenFromUrl();

      if (!token) {
        setErrorState("Token not found in the URL.");
        return;
      }

      setLoadingState();

      try {
        const url = VERIFY_API_URL + "?token=" + encodeURIComponent(token);

        const response = await fetch(url, {
          method: "GET"
        });

        const text = await response.text();

        let data = null;
        try {
          data = JSON.parse(text);
        } catch (_) {
          // nếu backend không trả JSON thì thôi
        }

        if (!response.ok) {
          setErrorState(
            data?.message || ("Verification failed. HTTP " + response.status)
          );
          return;
        }

        if (data && data.success === false) {
          setErrorState(data.message || "Verification failed.");
          return;
        }

        setSuccessState(data?.message);
      } catch (error) {
        setErrorState("Could not connect to the server. Please try again.");
      }
    }

    retryButtonEl.addEventListener("click", verifyEmail);

    verifyEmail();
  </script>
</body>
</html>
